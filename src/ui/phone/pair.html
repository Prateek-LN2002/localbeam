<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Pair with LocalBeam</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/phone.css">
<style>
  .pair { padding: 40px 18px; }
  .pair img { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 14px; }
  .pair h1 { text-align: center; margin-bottom: 6px; }
  .pair .lead { text-align: center; color: var(--muted); margin: 0 0 22px; }
  #code {
    width: 100%; font-size: 30px; letter-spacing: .3em; text-align: center; padding: 14px 10px; outline: none;
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
  }
  #code:focus { border-color: var(--accent); }
</style>
</head>
<body>
<main class="pair">
  <img src="/icon-192.png" alt="">
  <h1>LocalBeam</h1>
  <p class="lead">Enter the 6-digit code shown on the computer's Home screen.</p>
  <div class="card">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" aria-label="Pairing code">
    <button class="btn" id="go" type="button">Pair this device</button>
    <div class="msgstate" id="state"></div>
  </div>
</main>
<script>
  var code = document.getElementById('code'), go = document.getElementById('go'), state = document.getElementById('state');
  function say(cls, text) { state.className = 'msgstate' + (cls ? ' ' + cls : ''); state.textContent = text; }
  if (/[?&]expired=1/.test(location.search)) say('err', 'That QR code is no longer valid. Scan the new one, or enter the code.');

  async function pair() {
    var digits = code.value.replace(/\D/g, '');
    if (digits.length !== 6) return say('err', 'Enter all 6 digits');
    go.disabled = true;
    say('', 'Pairing…');
    try {
      var r = await fetch('/pair-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: digits }) });
      if (r.ok) { location.href = (await r.json()).url; return; }
      say('err', await r.text());
    } catch (e) { say('err', 'Cannot reach the computer'); }
    go.disabled = false;
  }
  go.onclick = pair;
  code.onkeydown = function (e) { if (e.key === 'Enter') pair(); };
  code.oninput = function () { say('', ''); };
</script>
</body>
</html>

# Xcode project description for the LocalBeam iPhone/iPad app.
# The Xcode project itself is generated from this file:  xcodegen generate
name: LocalBeam
options:
  bundleIdPrefix: app.localbeam
  deploymentTarget:
    iOS: "15.0"
targets:
  LocalBeam:
    type: application
    platform: iOS
    sources:
      - LocalBeam
    info:
      path: LocalBeam/Info.plist
      properties:
        CFBundleDisplayName: LocalBeam
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: LocalBeam uses the camera to scan the pairing QR code shown on your computer.
        NSLocalNetworkUsageDescription: LocalBeam connects to your computer on the same Wi-Fi to send and receive files.
        # The computer is reached by its local network address and proves its identity with the
        # certificate pinned at pairing, so the public-website rules do not apply to it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Downloaded files appear in the Files app under "On My iPhone > LocalBeam".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localbeam.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
